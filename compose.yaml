# A one-off migration, then the app on http://localhost:3000.
# Secrets, including the Neon DATABASE_URL, come from .env.

services:
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env

  app:
    build:
      context: .
      target: runner
      args:
        SITE_URL: ${SITE_URL:-https://ponoc.tech}
    env_file: .env
    ports:
      - "3000:3000"
    init: true
    # Docker's default is 10s. Sessions get up to 20s to finish verifying and
    # save usage (Session.ts DRAIN_TIMEOUT_MS), so give them room.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
